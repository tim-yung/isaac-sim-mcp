[package]
name = "isaac_sim_mcp_extension"
version = "0.3.0"
title = "Isaac Sim MCP Server"
description = "MCP server extension for Isaac Sim to enable communication with Claude and other AI assistants"
category = "Robotics"
keywords = ["mcp", "server", "socket", "simulation", "robotics"]

[dependencies]
# Isaac Sim 6.0+ (isaacsim.* namespace)
# omni.isaac.core / omni.isaac.ui / omni.kit.uiapp were removed in Isaac Sim 6.
# The only hard dependency for the socket server is omni.kit.async_engine (always
# present in Kit).  All isaac-specific helpers are lazy-imported inside their
# respective methods so the extension loads cleanly without them.
"omni.kit.async_engine" = {}



# Main python module this extension provides, it will be publicly available as "import isaac_sim_mcp_extension".
[[python.module]]
name = "isaac_sim_mcp_extension"



[python.pipapi]


[settings]
server.socket = 8766
server.host = "localhost"
